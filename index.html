<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    // Old store links (4nbt.shop/#shop, /#cart, …) lived on this URL.
    // The fragment never reaches the server, so forward it here.
    (function () {
      var hash = location.hash;
      if (hash && hash !== "#") {
        location.replace("/shop" + location.search + hash);
      }
    })();
  </script>
  <script>
    // Same key as /shop. Light until a visitor chooses dark.
    (function () {
      try {
        if (localStorage.getItem("4nbt-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    })();
  </script>
  <title>4nbt.shop</title>
  <meta name="description" content="Physical goods and digital collectibles." />

  <meta property="og:title" content="4nbt.shop" />
  <meta property="og:description" content="Physical goods and digital collectibles." />
  <meta property="og:image" content="https://4nbt.shop/og.png" />
  <meta property="og:image:width" content="750" />
  <meta property="og:image:height" content="450" />
  <meta property="og:url" content="https://4nbt.shop" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="4nbt.shop" />
  <meta name="twitter:description" content="Physical goods and digital collectibles." />
  <meta name="twitter:image" content="https://4nbt.shop/og.png" />
  <meta property="og:site_name" content="4nbt.shop" />
  <link rel="canonical" href="https://4nbt.shop" />

  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Caveat:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #ffffff;
      --ink: #000000;
      --ink-soft: #555555;
      --ink-faint: #aaaaaa;
      color-scheme: light;
    }

    html[data-theme="dark"] {
      --bg: #000000;
      --ink: #ffffff;
      --ink-soft: #aaaaaa;
      --ink-faint: #767676;
      color-scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      background: var(--bg);
      scroll-padding-bottom: 76px;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
      font-weight: 400;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 28px 28px 76px;
    }

    .mark {
      font-family: "Caveat", cursive;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: 0;
      text-transform: none;
      transform: rotate(-2deg);
      margin-bottom: 28px;
    }

    .gate {
      display: grid;
      /* Explicit square side: WebKit (all iOS browsers) can size
         aspect-ratio grid items wider than their 1fr track. */
      --side: min(432px, calc((100vw - 72px) / 2));
      grid-template-columns: repeat(2, var(--side));
      gap: 16px;
      max-width: 100%;
    }

    .gate a {
      width: var(--side);
      height: var(--side);
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--ink);
      background: var(--bg);
      color: var(--ink);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .gate a:hover,
    .gate a:focus-visible {
      background: var(--ink);
      color: var(--bg);
      outline: none;
    }
    .gate a:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 4px;
    }

    .theme-switch {
      position: fixed;
      right: max(14px, env(safe-area-inset-right));
      bottom: max(14px, env(safe-area-inset-bottom));
      z-index: 70;
      display: flex;
      border: 1.5px solid var(--ink);
      background: var(--bg);
    }
    .theme-switch button {
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      color: var(--ink);
      border: 0;
      border-right: 1.5px solid var(--ink);
      font-family: inherit;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      padding: 0 12px;
      min-height: 44px;
      cursor: pointer;
      line-height: 1;
      transition: background 0.2s ease, color 0.2s ease;
    }
    .theme-switch button:last-child { border-right: 0; }
    .theme-switch button:hover,
    .theme-switch button:focus-visible,
    .theme-switch button[aria-pressed="true"],
    html:not([data-theme="dark"]) .theme-switch button[data-theme-value="light"],
    html[data-theme="dark"] .theme-switch button[data-theme-value="dark"] {
      background: var(--ink);
      color: var(--bg);
    }
    .theme-switch button:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
      position: relative;
      z-index: 1;
    }

    html.theme-changing,
    html.theme-changing *,
    html.theme-changing *::before,
    html.theme-changing *::after {
      transition: none !important;
    }

    @media (max-width: 800px) {
      body { padding: 24px 18px 76px; }
      .mark { font-size: 26px; margin-bottom: 20px; }
      .gate {
        --side: min(420px, calc(100vw - 36px), calc((100vh - 220px) / 2));
        grid-template-columns: var(--side);
      }
    }

    @supports (height: 100dvh) {
      @media (max-width: 800px) {
        .gate { --side: min(420px, calc(100vw - 36px), calc((100dvh - 220px) / 2)); }
      }
    }

    @media (max-height: 640px) {
      .gate { --side: min(432px, calc((100vw - 72px) / 2), calc(100vh - 180px)); }
    }

    @media (prefers-reduced-motion: reduce) {
      .gate a, .theme-switch button { transition: none; }
    }
  </style>
</head>
<body>
  <p class="mark">4nbt.shop</p>
  <nav class="gate" aria-label="Store">
    <a href="/shop">PHYSICAL</a>
    <a href="https://nft.4nbt.shop">DIGITAL</a>
  </nav>
  <div class="theme-switch" role="group" aria-label="Color theme">
    <button type="button" data-theme-value="light" aria-pressed="true" aria-label="Switch to light mode">Light</button>
    <button type="button" data-theme-value="dark" aria-pressed="false" aria-label="Switch to dark mode">Dark</button>
  </div>
  <script>
    (function () {
      var KEY = "4nbt-theme";
      var root = document.documentElement;
      var buttons = document.querySelectorAll("[data-theme-value]");
      function apply(theme) {
        var dark = theme === "dark";
        root.classList.add("theme-changing");
        if (dark) root.setAttribute("data-theme", "dark");
        else root.removeAttribute("data-theme");
        buttons.forEach(function (btn) {
          var on = btn.getAttribute("data-theme-value") === (dark ? "dark" : "light");
          btn.setAttribute("aria-pressed", on ? "true" : "false");
        });
        requestAnimationFrame(function () {
          requestAnimationFrame(function () { root.classList.remove("theme-changing"); });
        });
      }
      buttons.forEach(function (btn) {
        btn.addEventListener("click", function () {
          var next = btn.getAttribute("data-theme-value") === "dark" ? "dark" : "light";
          try { localStorage.setItem(KEY, next); } catch (e) {}
          apply(next);
        });
      });
      window.addEventListener("storage", function (e) {
        if (e.key === KEY) apply(e.newValue === "dark" ? "dark" : "light");
      });
      apply(root.getAttribute("data-theme") === "dark" ? "dark" : "light");
    })();
  </script>
</body>
</html>
