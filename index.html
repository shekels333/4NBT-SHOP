<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TB HOLO STICKER — 4NBT</title>
  <meta name="description" content="TB holo sticker. 3-inch holographic die-cut vinyl. Ships worldwide." />

  <!-- Open Graph -->
  <meta property="og:title" content="TB HOLO STICKER — 4NBT" />
  <meta property="og:description" content="TB holo sticker. 3-inch holographic die-cut vinyl. Ships worldwide." />
  <meta property="og:image" content="https://4nbt.shop/og.jpg" />
  <meta property="og:url" content="https://4nbt.shop" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90' font-family='serif' fill='black'%3E%E2%82%AA%3C/text%3E%3C/svg%3E" />

  <!-- Fonts: clean grotesk for UI + marker hand for accents -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&family=Caveat:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #ffffff;
      --ink: #000000;
      --ink-soft: #555555;
      --ink-faint: #aaaaaa;
      --rule: rgba(0, 0, 0, 0.08);
      --accent: #000;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Hanken Grotesk", system-ui, -apple-system, sans-serif;
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.02em;
      line-height: 1.5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* === HEADER === */
    header {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 28px;
      z-index: 50;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--rule);
    }

    .logo {
      font-family: "Caveat", cursive;
      font-weight: 700;
      font-size: 28px;
      letter-spacing: -0.01em;
      line-height: 1;
      transform: rotate(-3deg);
      transform-origin: left center;
    }

    .nav {
      display: flex;
      gap: 28px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      font-weight: 500;
    }
    .nav a {
      color: var(--ink);
      text-decoration: none;
      position: relative;
      padding: 4px 0;
    }
    .nav a::after {
      content: "";
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 1px;
      background: var(--ink);
      transition: width 0.35s ease;
    }
    .nav a:hover::after { width: 100%; }
    .nav .cart-count { color: var(--ink-faint); }

    /* === MAIN === */
    main {
      padding-top: 80px;
      min-height: 100vh;
    }

    .product {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 6vw;
      max-width: 1400px;
      margin: 0 auto;
      padding: 4vh 5vw 8vh;
      align-items: center;
      min-height: calc(100vh - 80px);
    }

    .product-image {
      position: relative;
      animation: fadeUp 1s cubic-bezier(0.2, 0.7, 0.2, 1) both;
    }
    .product-image img {
      width: 100%;
      max-width: 720px;
      display: block;
      margin: 0 auto;
      user-select: none;
      -webkit-user-drag: none;
    }
    .product-image .corner-mark {
      position: absolute;
      top: -8px; left: -8px;
      font-family: "Caveat", cursive;
      font-size: 18px;
      color: var(--ink-soft);
      transform: rotate(-8deg);
    }
    .product-image .edition-mark {
      position: absolute;
      bottom: 8px; right: 0;
      font-family: "Caveat", cursive;
      font-size: 22px;
      color: var(--ink);
      transform: rotate(2deg);
    }

    .product-info {
      animation: fadeUp 1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.15s both;
      max-width: 380px;
    }
    .product-info .eyebrow {
      font-family: "Caveat", cursive;
      font-size: 22px;
      color: var(--ink-soft);
      margin-bottom: 6px;
      transform: rotate(-1.5deg);
      display: inline-block;
    }
    .product-info h1 {
      font-size: clamp(34px, 5vw, 56px);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 0.95;
      margin-bottom: 18px;
    }
    .price-row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 16px 0;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
      margin-bottom: 24px;
    }
    .price {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .price-usd {
      font-size: 12px;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      transition: opacity 0.25s ease, color 0.4s ease;
    }
    .price-usd.flash { color: var(--ink); opacity: 1; }
    .price-usd.loading { opacity: 0.4; }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px 24px;
      margin-bottom: 28px;
      font-size: 12px;
    }
    .meta dt {
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-size: 10px;
      margin-bottom: 2px;
    }
    .meta dd { color: var(--ink); margin-bottom: 10px; }

    .qty {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 16px;
      padding: 14px 0;
      border-bottom: 1px solid var(--rule);
    }
    .qty label {
      text-transform: uppercase;
      letter-spacing: 0.14em;
      font-size: 10px;
      color: var(--ink-faint);
    }
    .qty-buttons {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-left: auto;
    }
    .qty-btn {
      background: none;
      border: 1px solid var(--ink);
      width: 30px; height: 30px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .qty-btn:hover { background: var(--ink); color: #fff; }
    .qty-btn:disabled {
      border-color: var(--ink-faint);
      color: var(--ink-faint);
      cursor: not-allowed;
    }
    .qty-btn:disabled:hover { background: none; color: var(--ink-faint); }
    .qty-value {
      font-size: 16px;
      font-weight: 500;
      min-width: 22px;
      text-align: center;
    }

    .buy-btn {
      width: 100%;
      padding: 18px;
      background: var(--ink);
      color: #fff;
      border: none;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.22em;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease;
    }
    .buy-btn:hover { transform: translateY(-1px); }
    .buy-btn:active { transform: translateY(0); }
    .buy-btn::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.18) 50%, transparent 70%);
      transform: translateX(-100%);
      transition: transform 0.6s ease;
    }
    .buy-btn:hover::after { transform: translateX(100%); }

    .buy-note {
      font-family: "Caveat", cursive;
      font-size: 18px;
      color: var(--ink-soft);
      margin-top: 12px;
      transform: rotate(-1deg);
      display: inline-block;
    }

    .mint-counter {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--ink-soft);
    }
    .mint-counter .dot {
      width: 6px; height: 6px;
      background: #00b341;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    /* === FOOTER === */
    footer {
      padding: 40px 28px 28px;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--ink-soft);
    }
    footer .footer-mark {
      font-family: "Caveat", cursive;
      font-size: 20px;
      color: var(--ink);
      text-transform: none;
      letter-spacing: 0;
      transform: rotate(-2deg);
      display: inline-block;
    }
    footer .links { display: flex; gap: 18px; }
    footer .links a {
      color: var(--ink-soft);
      text-decoration: none;
      transition: color 0.2s;
    }
    footer .links a:hover { color: var(--ink); }

    /* === SIGNATURE MARK === */
    .signature {
      position: fixed;
      bottom: 8px; left: 10px;
      font-family: ui-serif, Georgia, serif;
      font-size: 16px;
      color: rgba(0,0,0,0.3);
      z-index: 5;
      pointer-events: none;
      animation: breathe 5.5s ease-in-out infinite;
    }

    /* === ANIMATIONS === */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(0.85); }
    }
    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }

    /* === RESPONSIVE === */
    @media (max-width: 800px) {
      header { padding: 16px 18px; }
      .logo { font-size: 24px; }
      .nav { gap: 18px; font-size: 10px; letter-spacing: 0.14em; }

      main { padding-top: 64px; }
      .product {
        grid-template-columns: 1fr;
        gap: 32px;
        padding: 4vh 6vw 10vh;
        min-height: auto;
      }
      .product-image img { max-width: 100%; }
      .product-info { max-width: 100%; margin: 0 auto; }
      .product-info h1 { font-size: 38px; }

      footer { padding: 28px 18px; gap: 12px; flex-direction: column; align-items: flex-start; }
      .signature { bottom: 4px; left: 6px; font-size: 14px; }
    }

    @media (max-width: 480px) {
      .meta { grid-template-columns: 1fr; }
      .nav { font-size: 9px; gap: 14px; }
    }
  </style>
</head>

  <script>
    // Quantity selector (soft cap for the on-page picker; no purchase limit)
    const MAX_QTY = 10;
    let qty = 1;
    const valueEl = document.getElementById("qtyValue");
    const plusEl = document.getElementById("qtyPlus");
    const minusEl = document.getElementById("qtyMinus");

    function update() {
      valueEl.textContent = qty;
      minusEl.disabled = qty <= 1;
      plusEl.disabled = qty >= MAX_QTY;
    }
    plusEl.addEventListener("click", () => { if (qty < MAX_QTY) { qty++; update(); } });
    minusEl.addEventListener("click", () => { if (qty > 1) { qty--; update(); } });

    // ─────────────────────────────────────────────────────────────
    // Buy button → Shopify checkout with selected quantity
    // ─────────────────────────────────────────────────────────────
    // Shopify cart permalink: sends the buyer straight to checkout with the
    // sticker + chosen quantity pre-loaded. No SDK, no script tags.
    //
    //   SHOPIFY_DOMAIN  -> your store's myshopify domain (or custom checkout domain)
    //   VARIANT_ID      -> the numeric variant ID of the TB Holo Sticker in Shopify
    //
    const SHOPIFY_DOMAIN = "4nbt.myshopify.com";
    const VARIANT_ID     = "46207409750060";

    const buyBtn = document.getElementById("buyBtn");

    // Open checkout in a compact popup window so the page stays underneath.
    // Shopify checkout can't be iframed, but a popup keeps the buyer on-site.
    buyBtn.addEventListener("click", () => {
      const url = `https://${SHOPIFY_DOMAIN}/cart/${VARIANT_ID}:${qty}`;

      const w = 520, h = 780;
      const left = Math.max(0, Math.round(window.screenX + (window.outerWidth  - w) / 2));
      const top  = Math.max(0, Math.round(window.screenY + (window.outerHeight - h) / 2));
      const features = `popup=yes,width=${w},height=${h},left=${left},top=${top},resizable=yes,scrollbars=yes`;

      const win = window.open(url, "shopifyCheckout", features);

      // If the browser blocked the popup (or on mobile, where popups become tabs), fall back.
      if (!win || win.closed || typeof win.closed === "undefined") {
        window.location.href = url;
      } else {
        win.focus();
      }
    });
  </script>
