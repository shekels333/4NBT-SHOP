  <style>
    :root {
      --bg: #fff;
      --ink: #000;
      --mark: rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      width: 100%;
      background: var(--bg);
      overflow: hidden;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
    }

    main {
      position: relative;
      height: 100%;
      width: 100%;
      display: grid;
      place-items: center;
      padding: 6vmin;
    }

    .note {
      max-width: min(540px, 78vmin);
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      opacity: 0;
      transform: translateY(8px) scale(0.985);
      animation: settle 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) 0.15s forwards;
      user-select: none;
      -webkit-user-drag: none;
    }

    @keyframes settle {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Signature ₪ — pulses very slowly */
    .mark {
      position: fixed;
      bottom: 2.4vmin;
      right: 2.8vmin;
      color: var(--mark);
      font-family: ui-serif, Georgia, serif;
      font-size: clamp(14px, 2.2vmin, 22px);
      letter-spacing: 0.05em;
      opacity: 0;
      animation:
        fadein 2s ease 1.2s forwards,
        breathe 5.5s ease-in-out 3s infinite;
      pointer-events: none;
    }

    @keyframes fadein {
      to { opacity: 1; }
    }

    @keyframes breathe {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.45; }
    }

    /* Reduced motion: skip animations */
    @media (prefers-reduced-motion: reduce) {
      .note { opacity: 1; transform: none; animation: none; }
      .mark { opacity: 1; animation: none; }
    }
  </style>
